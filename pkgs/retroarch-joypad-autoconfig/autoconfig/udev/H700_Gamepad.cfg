input_driver = "udev"
input_device = "H700 Gamepad"
input_vendor_id = "18507"
input_product_id = "5343"

# Face buttons (Nintendo layout: A right, B bottom, X left/west, Y top/north)
input_a_btn = "1"
input_b_btn = "0"
input_x_btn = "3"
input_y_btn = "2"

# D-pad
input_up_btn = "13"
input_down_btn = "14"
input_left_btn = "15"
input_right_btn = "16"

# Shoulders / triggers (standard Linux button conventions:
# BTN_TL=4 BTN_TR=5 BTN_TL2=6 BTN_TR2=7)
input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"

# Thumbstick clicks (H700 has no analog sticks but exports BTN_THUMBL/R)
input_l3_btn = "11"
input_r3_btn = "12"

# Select / Start
input_select_btn = "8"
input_start_btn = "9"

# Mode (M button, id 10) is bound to the RetroArch menu toggle.

# H700 Gamepad has no analog axes (evtest: ABS=0).
