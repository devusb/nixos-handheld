name: update-packages
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # daily at 3am UTC, after update-flake-lock (2am)
jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Run nix-update per package
        run: |
          set -uo pipefail
          attrs="libretro.flycast2021 emulationstation-fcamod gptokeyb2 es-theme-gbz35-mod SDL2_classic linux-h700"
          for a in $attrs; do
            echo "::group::$a"
            nix run nixpkgs#nix-update -- \
              --flake --use-update-script --commit \
              "legacyPackages.aarch64-linux.$a" \
              || echo "::warning::no update or update failed for $a"
            echo "::endgroup::"
          done
      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          branch: update-packages
          delete-branch: true
          title: "Update packages"
          labels: |
            dependencies
            automated
          body: |
            Automated package bumps via nix-update. Built by buildbot-nix on aarch64.
