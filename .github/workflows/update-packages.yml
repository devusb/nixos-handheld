name: update-packages
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 5' # Fridays at 3am UTC, the day after update-flake-lock
jobs:
  packages:
    runs-on: ubuntu-24.04-arm
    env:
      NIX_PATH: nixpkgs=flake:nixpkgs
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31.10.7
      # Substitutes from the attic cache that buildbot fills.
      - name: Use attic cache
        uses: ryanccn/attic-action@v0.5.2
        with:
          endpoint: ${{ secrets.ATTIC_ENDPOINT }}
          cache: ${{ secrets.ATTIC_CACHE }}
          token: ${{ secrets.ATTIC_TOKEN }}
          skip-push: true
      # nix-update runs each package's updateScript, then the action opens one
      # combined PR.
      - name: Update packages
        uses: gepbird/nix-update-action@v3.1.2
        with:
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          packages: >-
            legacyPackages.aarch64-linux.emulationstation-fcamod,
            legacyPackages.aarch64-linux.gptokeyb2,
            legacyPackages.aarch64-linux.es-theme-gbz35-mod,
            legacyPackages.aarch64-linux.SDL2_classic,
            legacyPackages.aarch64-linux.linux-h700
          branch: update-packages
          pr-title: "Update packages"
          pr-labels: |
            dependencies
            automated
