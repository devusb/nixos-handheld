odroidgoa-uboot-config

setenv dtbo_loadaddr  0x01e00000
setenv dtb_loadaddr   0x01f00000
setenv loadaddr       0x02000000

setenv bootargs "root=LABEL=NIXOS_SD rootfstype=ext4 rootwait rw init=/init console=tty0 fbcon=rotate:0 usbcore.autosuspend=-1"

if load mmc 1:2 ${loadaddr} boot/Image
then
    setexpr initrd_loadaddr ${loadaddr} + ${filesize}
    setexpr initrd_loadaddr ${initrd_loadaddr} + 0x01000000
    if load mmc 1:2 ${initrd_loadaddr} boot/initrd
    then
        setenv ramdisk_size ${filesize}
        if load mmc 1:2 ${dtb_loadaddr} boot/dtb
        then
            if load mmc 1:1 ${dtbo_loadaddr} "ScreenFiles/Panel 4/mipi-panel.dtbo"
            then
                fdt addr ${dtb_loadaddr}
                fdt resize 8192
                fdt apply ${dtbo_loadaddr}
            fi

            booti ${loadaddr} ${initrd_loadaddr}:${ramdisk_size} ${dtb_loadaddr}
        fi
    fi
fi
