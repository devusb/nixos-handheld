<?xml version="1.0"?>
<!-- H700 Gamepad mapping captured from ES wizard on 2026-03-18.
     Pure-digital pad (no analog sticks per evtest). vid 0x484b pid 0x14df. -->
<inputList>
  <inputConfig type="joystick" deviceName="H700 Gamepad">
    <input name="a" type="button" id="1" value="1" />
    <input name="b" type="button" id="0" value="1" />
    <input name="x" type="button" id="3" value="1" />
    <input name="y" type="button" id="2" value="1" />
    <!-- start → M button (id=10) so the ES main menu opens via M.
         Physical start (button 9) is unmapped in ES; in-game start
         is handled by RA's own pad autoconfig. -->
    <input name="start" type="button" id="10" value="1" />
    <input name="select" type="button" id="8" value="1" />
    <input name="up" type="button" id="13" value="1" />
    <input name="down" type="button" id="14" value="1" />
    <input name="left" type="button" id="15" value="1" />
    <input name="right" type="button" id="16" value="1" />
    <input name="pageup" type="button" id="4" value="1" />
    <input name="pagedown" type="button" id="5" value="1" />
    <input name="hotkey" type="button" id="8" value="1" />
  </inputConfig>
</inputList>
