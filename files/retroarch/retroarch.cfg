# RetroArch config for R36H (640x480 DRM/KMS)

# Video — direct DRM, no compositor
video_driver = "drm"
video_fullscreen = "true"
video_windowed_fullscreen = "false"

# Menu
menu_driver = "rgui"
rgui_aspect_ratio_lock = "2"

# Audio
audio_driver = "alsa"

# Input — use udev to find gamepad
input_driver = "udev"
input_joypad_driver = "udev"

# Auto-save states
savestate_auto_load = "true"
savestate_auto_save = "true"

# ROM directory
rgui_browser_directory = "/roms"

# Hide unnecessary menu items
content_show_contentless_cores = "0"
content_show_explore = "false"
content_show_favorites = "false"
content_show_history = "true"
content_show_images = "false"
content_show_music = "false"
content_show_video = "false"

# System directory for BIOS files etc
system_directory = "/roms/system"
